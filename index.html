<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Youtube L.ink</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg-dark: #0a0a0c;
      --bg-card: rgba(22, 22, 28, 0.75);
      --bg-hover: rgba(255, 255, 255, 0.06);
      --bg-input: #121216;
      --accent-red: #ff334b;
      --accent-red-glow: rgba(255, 51, 75, 0.35);
      --accent-green: #00e676;
      --accent-green-glow: rgba(0, 230, 118, 0.3);
      --discord-blurple: #5865f2;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 51, 75, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; user-select: none; }
    
    body { 
      background-color: var(--bg-dark); 
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 51, 75, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(88, 101, 242, 0.08) 0px, transparent 50%);
      color: var(--text-main); 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
    }

    .titlebar {
      height: 40px; 
      background: rgba(10, 10, 12, 0.8); 
      backdrop-filter: blur(10px);
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      padding: 0 18px; 
      -webkit-app-region: drag; 
      border-bottom: 1px solid var(--border-color); 
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 13px; letter-spacing: 0.8px; }
    .brand-logo { 
      color: #fff; 
      background: linear-gradient(135deg, var(--accent-red), #ff6b81);
      width: 22px; height: 22px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      box-shadow: 0 0 12px var(--accent-red-glow);
    }
    .version-tag { font-size: 11px; color: var(--text-muted); font-weight: 600; }

    .container { display: flex; flex: 1; padding: 18px; gap: 18px; height: calc(100vh - 40px); overflow: hidden; }
    
    .player-section { 
      flex: 3.2; 
      background: var(--bg-card); 
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color); 
      border-radius: 20px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      overflow: hidden; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    
    .search-bar-wrap { 
      display: flex; 
      gap: 10px; 
      background: var(--bg-input); 
      padding: 6px 6px 6px 14px; 
      border-radius: 14px; 
      border: 1px solid var(--border-color); 
      align-items: center; 
      transition: all 0.25s ease;
    }
    .search-bar-wrap:focus-within {
      border-color: var(--border-active);
      box-shadow: 0 0 15px var(--accent-red-glow);
    }
    .search-input { 
      flex: 1; 
      background: transparent; 
      border: none; 
      color: #fff; 
      outline: none; 
      font-size: 13px; 
      font-weight: 500;
    }
    .search-input::placeholder { color: var(--text-muted); }

    .btn-action { 
      background: linear-gradient(135deg, var(--accent-red), #e0002b); 
      color: #fff; 
      font-weight: 700; 
      border: none; 
      border-radius: 10px; 
      padding: 10px 20px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      font-size: 13px; 
      box-shadow: 0 4px 12px var(--accent-red-glow);
    }
    .btn-action:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 18px var(--accent-red-glow); }
    .btn-action:active { transform: translateY(0); }

    .video-container { 
      flex: 1; 
      background: #000000; 
      border-radius: 14px; 
      overflow: hidden; 
      position: relative; 
      border: 1px solid var(--border-color); 
      min-height: 320px; 
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    #playerWebview { width: 100%; height: 100%; border: none; }

    .player-toolbar { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      background: var(--bg-input); 
      padding: 12px 18px; 
      border-radius: 14px; 
      border: 1px solid var(--border-color); 
    }
    .now-playing-title { 
      font-size: 13px; 
      font-weight: 600; 
      color: var(--text-main); 
      max-width: 60%; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      display: flex; align-items: center; gap: 8px;
    }
    
    .autoplay-toggle { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-sub); font-weight: 600; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { 
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
      background-color: #2a2a35; transition: .3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 24px; 
    }
    .slider:before { 
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; 
      background-color: #a1a1aa; transition: .3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 50%; 
    }
    input:checked + .slider { background-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green-glow); }
    input:checked + .slider:before { transform: translateX(20px); background-color: #fff; }

    .side-section { 
      flex: 1.4; 
      background: var(--bg-card); 
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color); 
      border-radius: 20px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
      overflow: hidden; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .section-title { 
      font-size: 11px; 
      font-weight: 800; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 1.2px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }

    .user-card { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      background: var(--bg-hover); 
      padding: 12px 14px; 
      border-radius: 12px; 
      border: 1px solid var(--border-color); 
    }
    .avatar { 
      width: 36px; height: 36px; 
      border-radius: 10px; 
      background: linear-gradient(135deg, var(--discord-blurple), #8a2be2); 
      display: flex; align-items: center; justify-content: center; 
      font-weight: 800; font-size: 12px;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
    }
    .user-status { font-size: 11px; color: var(--accent-green); display: flex; align-items: center; gap: 6px; font-weight: 600; margin-top: 2px;}
    .status-dot { width: 7px; height: 7px; background-color: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green-glow); }

    .host-badge {
      background: linear-gradient(135deg, #ffb703, #fb8500);
      color: #000;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      display: none;
      margin-left: 4px;
    }

    .tab-header { display: flex; gap: 8px; margin-bottom: 4px; }
    .tab-btn {
      flex: 1; padding: 6px 10px;
      background: var(--bg-input); border: 1px solid var(--border-color);
      color: var(--text-sub); font-size: 11px; font-weight: 700;
      border-radius: 8px; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1); color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .results-list, .queue-list { 
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; 
    }
    .results-list::-webkit-scrollbar, .queue-list::-webkit-scrollbar { width: 4px; }
    .results-list::-webkit-scrollbar-thumb, .queue-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .video-card { 
      display: flex; gap: 10px; background: var(--bg-input); padding: 8px; 
      border-radius: 12px; border: 1px solid var(--border-color); align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); position: relative;
    }
    .video-card:hover { 
      background: var(--bg-hover); border-color: rgba(255, 255, 255, 0.2); transform: translateX(3px); 
    }
    .card-thumb { width: 80px; height: 45px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #18181b; cursor: pointer; }
    .card-info { display: flex; flex-direction: column; justify-content: center; gap: 2px; overflow: hidden; flex: 1; cursor: pointer; }
    .card-title { font-size: 11px; font-weight: 600; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
    .card-channel { font-size: 10px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .btn-add-queue, .btn-remove-queue {
      background: rgba(255, 255, 255, 0.08); border: none; color: #fff;
      border-radius: 6px; width: 26px; height: 26px; display: flex;
      align-items: center; justify-content: center; cursor: pointer;
      font-size: 12px; flex-shrink: 0; transition: background 0.2s;
    }
    .btn-add-queue:hover { background: var(--accent-green); }
    .btn-remove-queue:hover { background: var(--accent-red); }

    .sync-log { 
      height: 85px; background: var(--bg-input); border-radius: 12px; 
      padding: 10px; font-family: 'JetBrains Mono', monospace, sans-serif; 
      font-size: 10px; color: var(--text-sub); overflow-y: auto; 
      border: 1px solid var(--border-color); flex-shrink: 0; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="brand">
      <div class="brand-logo">▶</div>
      <span>Youtube L.ink</span>
    </div>
    <div class="version-tag">v1.5.0</div>
  </div>

  <div class="container">
    <div class="player-section">
      <div class="search-bar-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="검색어 입력 또는 유튜브 링크 복사..." onkeydown="if(event.key==='Enter') executeSearch()" />
        <button class="btn-action" onclick="executeSearch()">검색 / 재생</button>
      </div>

      <div class="video-container">
        <webview id="playerWebview" src="about:blank" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36"></webview>
      </div>

      <div class="player-toolbar">
        <div class="now-playing-title" id="nowPlayingText">🎵 재생 준비 완료</div>
        <div class="autoplay-toggle">
          <span>알고리즘 연속재생</span>
          <label class="switch">
            <input type="checkbox" id="autoplayCheck" checked onchange="toggleAutoplay(this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="side-section">
      <div>
        <div class="section-title" style="margin-bottom: 10px;">동기화 상태</div>
        <div class="user-card">
          <div class="avatar">LINK</div>
          <div>
            <div style="font-size: 12px; font-weight: 700; display: flex; align-items: center;">
              내 플레이어
              <span class="host-badge" id="hostBadge">👑 HOST</span>
            </div>
            <div class="user-status" id="statusText">
              <span class="status-dot" id="statusDot"></span>
              <span id="statusLabel">서버 연결 중...</span>
            </div>
          </div>
        </div>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div class="tab-header">
          <button class="tab-btn active" id="tabQueueBtn" onclick="switchTab('queue')">대기열 (<span id="queueCount">0</span>)</button>
          <button class="tab-btn" id="tabSearchBtn" onclick="switchTab('search')">검색 목록</button>
        </div>

        <div class="queue-list" id="queueList"></div>
        <div class="results-list" id="resultsList" style="display: none;"></div>
      </div>

      <div>
        <div class="section-title" style="margin-bottom: 8px;">실시간 이벤트 로그</div>
        <div class="sync-log" id="logBox">
          [System] 양방향 구간 스킵 및 동시 동기화 가동 중
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <script>
    const { ipcRenderer } = require('electron');

    let playerWebview;
    let socket;
    let isRemote = false;
    let isHost = false;
    let currentVideoId = 'fJ9rUzIMcZQ';
    let isAutoplayEnabled = true;

    let playQueue = [];
    let lastTimeSyncSent = 0;
    let lastNextTriggerTime = 0;
    let readySent = false;

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function extractVideoId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    window.addEventListener('DOMContentLoaded', () => {
      playerWebview = document.getElementById('playerWebview');

      const handleUrlChange = (url) => {
        const nextVideoId = extractVideoId(url);
        if (nextVideoId && nextVideoId !== currentVideoId) {
          if (isHost && !isRemote) {
            addLog(`[Host Sync] 호스트 알고리즘 다음곡 탐지 -> 전체 동기화 (${nextVideoId})`);
            playAndSyncVideo(nextVideoId, '방장 추천 알고리즘 곡');
          } else if (!isHost && !isRemote) {
            addLog(`[System] 파티원 개별 탐색 차단 -> 방장 화면에 고정합니다.`);
            loadYoutubeVideo(currentVideoId);
          }
        }
      };

      playerWebview.addEventListener('will-navigate', (e) => handleUrlChange(e.url));
      playerWebview.addEventListener('did-navigate', (e) => handleUrlChange(e.url));

      playerWebview.addEventListener('dom-ready', () => {
        playerWebview.insertCSS(`
          .video-ads, .ytp-ad-module, .ytp-ad-overlay-container,
          ytd-promoted-sparkles-web-renderer, ytd-display-ad-renderer,
          ytd-statement-banner-renderer, ytd-in-feed-ad-layout-renderer,
          ytd-banner-promo-renderer, #masthead-ad, .ytp-ad-skip-button-container,
          .ytp-ad-text-inline, .ytp-ad-preview-container { display: none !important; }
          #masthead-container, #sidebar, #comments, #below, #secondary, #masthead, ytd-miniplayer { display: none !important; }
          body, html { overflow: hidden !important; background: #000 !important; }
          #page-manager { margin-top: 0 !important; padding: 0 !important; }
          #primary, ytd-watch-flexy, #player, #player-container, .html5-video-player { width: 100vw !important; height: 100vh !important; max-height: 100vh !important; }
        `);

        // 웹뷰 스크립트 주입 (Seeking 구간 건너뛰기 이벤트 감지 추가)
        playerWebview.executeJavaScript(`
          (function() {
            if (window.__urlTracker) return;
            window.__urlTracker = true;

            let lastUrl = location.href;
            setInterval(() => {
              if (location.href !== lastUrl) {
                lastUrl = location.href;
                console.log('[URL_CHANGED]:' + location.href);
              }
            }, 500);

            function processAd() {
              const player = document.querySelector('.html5-video-player');
              const video = document.querySelector('video');
              if (!video) return;

              const isAd = player && player.classList.contains('ad-showing');

              if (isAd) {
                video.muted = true;
                video.playbackRate = 16.0;
                if (!isNaN(video.duration) && video.duration > 0) {
                  video.currentTime = video.duration - 0.01;
                }
                const skipBtn = document.querySelector('.ytp-ad-skip-button, .ytp-ad-skip-button-modern, .ytp-skip-ad-button, .ytp-ad-skip-button-slot');
                if (skipBtn) skipBtn.click();
              }
            }

            const observer = new MutationObserver(() => {
              processAd();
            });

            observer.observe(document.body, {
              childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'src']
            });

            setInterval(() => {
              const video = document.querySelector('video');
              const player = document.querySelector('.html5-video-player');
              const isAd = player && player.classList.contains('ad-showing');

              // 🔥 [구간 탐색/건너뛰기 실시간 감지]
              if (video && !video.__seekListener) {
                video.__seekListener = true;
                video.addEventListener('seeking', () => {
                  console.log('[SEEK_EVENT]:' + video.currentTime);
                });
              }

              if (video && !isAd && video.readyState >= 3) {
                console.log('[READY_FOR_SYNC]');
              }
              if (video && !video.paused && !isAd) {
                console.log('[TIME_SYNC]:' + video.currentTime);
              }
              if (video && video.ended && !isAd) {
                console.log('[VIDEO_ENDED]');
              }
            }, 300);
          })();
        `);
      });

      playerWebview.addEventListener('console-message', (e) => {
        if (e.message.startsWith('[URL_CHANGED]:')) {
          const url = e.message.replace('[URL_CHANGED]:', '');
          handleUrlChange(url);
        }
        // 🔥 [양방향 구간 스킵 감지] 방장/파티원 누구든 스킵하면 서버로 보고
        else if (e.message.startsWith('[SEEK_EVENT]:')) {
          if (isRemote) return; // 외부 신호 수신으로 인한 조작은 무시 (반복루프 방지)

          const seekTime = parseFloat(e.message.replace('[SEEK_EVENT]:', ''));
          socket.emit('sync-seek', { currentTime: seekTime });
          addLog(`[Seek] 구간 스킵 감지 -> (${Math.floor(seekTime)}초) 전체 동기화`);
        }
        else if (e.message === '[READY_FOR_SYNC]') {
          if (!readySent) {
            readySent = true;
            playerWebview.executeJavaScript(`document.querySelector('video')?.pause();`);
            socket.emit('client-ready', { videoId: currentVideoId });
            addLog('[Sync] 로딩 완료 -> 파티원 동시 출발 대기 중...');
          }
        }
        else if (e.message.startsWith('[TIME_SYNC]:')) {
          if (isRemote) return;
          const currentTime = parseFloat(e.message.replace('[TIME_SYNC]:', ''));
          const now = Date.now();
          if (now - lastTimeSyncSent > 2000) {
            socket.emit('sync-time', { currentTime });
            lastTimeSyncSent = now;
          }
        } 
        else if (e.message === '[VIDEO_ENDED]') {
          if (isRemote) return;
          handleVideoFinished();
        }
      });

      loadYoutubeVideo(currentVideoId);
    });

    function loadYoutubeVideo(videoId) {
      if (!playerWebview) return;
      readySent = false;
      const watchUrl = `https://www.youtube.com/watch?v=${videoId}`;
      playerWebview.src = watchUrl;
    }

    function handleVideoFinished() {
      const now = Date.now();
      if (now - lastNextTriggerTime < 3000) return;
      lastNextTriggerTime = now;

      if (playQueue.length > 0) {
        playNextInQueue();
      } 
      else if (isAutoplayEnabled) {
        if (isHost) {
          playerWebview.executeJavaScript(`
            (function() {
              const nextBtn = document.querySelector('a.ytp-next-button');
              if (nextBtn && nextBtn.href) {
                return nextBtn.href;
              }
              return null;
            })();
          `).then((nextUrl) => {
            if (nextUrl) {
              const nextVideoId = extractVideoId(nextUrl);
              if (nextVideoId) {
                addLog(`[Autoplay] 호스트 다음 알고리즘 전환: ${nextVideoId}`);
                playAndSyncVideo(nextVideoId, '알고리즘 추천 곡');
              }
            }
          });
        } else {
          addLog('[Autoplay Sync] 호스트의 알고리즘 전환 신호를 기다리는 중...');
        }
      }
    }

    socket = io('https://youtube-l-ink-server.onrender.com');

    socket.on('connect', () => {
      document.getElementById('statusLabel').innerText = '실시간 파티 연결됨';
      document.getElementById('statusDot').style.backgroundColor = 'var(--accent-green)';
      addLog('[Socket] 파티 서버에 연결되었습니다.');
    });

    socket.on('disconnect', () => {
      document.getElementById('statusLabel').innerText = '연결 끊김';
      document.getElementById('statusDot').style.backgroundColor = 'var(--accent-red)';
      document.getElementById('hostBadge').style.display = 'none';
      isHost = false;
      addLog('[Socket] 서버 연결이 끊어졌습니다.');
    });

    socket.on('host-status', (data) => {
      isHost = data.isHost;
      const hostBadge = document.getElementById('hostBadge');
      if (isHost) {
        hostBadge.style.display = 'inline-block';
        addLog('👑 당신이 이 파티의 방장(Host)입니다.');
      } else {
        hostBadge.style.display = 'none';
      }
    });

    socket.on('init-state', (state) => {
      if (state.videoId) {
        currentVideoId = state.videoId;
        loadYoutubeVideo(state.videoId);
      }
      if (state.queue) {
        playQueue = state.queue;
        renderQueueList();
      }
      isAutoplayEnabled = state.isAutoplay ?? true;
      document.getElementById('autoplayCheck').checked = isAutoplayEnabled;
    });

    socket.on('sync-action', (data) => {
      if (!playerWebview) return;
      isRemote = true;

      if (data.action === 'load') {
        currentVideoId = data.videoId;
        loadYoutubeVideo(data.videoId);
        if (data.title) updateNowPlaying(data.title);
        addLog(`[Link] 곡 변경: ${data.title || data.videoId}`);
      }

      setTimeout(() => { isRemote = false; }, 1000);
    });

    socket.on('start-play', (data) => {
      addLog('🚀 모든 사용자 준비 완료! 동시에 재생을 시작합니다.');
      
      playerWebview.executeJavaScript(`
        (function() {
          const video = document.querySelector('video');
          if (video) {
            video.currentTime = ${data.currentTime || 0};
            
            var playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.then(() => {
                console.log('재생 성공!');
              }).catch(error => {
                console.log('자동재생 블락됨 -> 음소거 후 재생 시도');
                video.muted = true;
                video.play();
              });
            }
          }
        })();
      `);
    });

    // 🔥 [양방향 구간 이동 수신] 타인에 의해 구간이 스킵되면 내 영상 위치도 즉시 이동
    socket.on('sync-seek', (data) => {
      if (!playerWebview) return;
      isRemote = true;

      playerWebview.executeJavaScript(`
        (function() {
          const video = document.querySelector('video');
          if (video) {
            video.currentTime = ${data.currentTime};
          }
        })();
      `);

      addLog(`[Seek Sync] 누군가에 의해 ${Math.floor(data.currentTime)}초로 구간이 스킵되었습니다.`);

      setTimeout(() => { isRemote = false; }, 1200);
    });

    socket.on('sync-time', (data) => {
      if (!playerWebview || isRemote) return;

      playerWebview.executeJavaScript(`
        const video = document.querySelector('video');
        if (video) {
          if (Math.abs(video.currentTime - ${data.currentTime}) > 2) {
            video.currentTime = ${data.currentTime};
          }
        }
      `);
    });

    socket.on('sync-queue', (data) => {
      playQueue = data.queue || [];
      renderQueueList();
      addLog('[Queue] 대기열 동기화 완료');
    });

    socket.on('toggle-autoplay', (data) => {
      isAutoplayEnabled = data.isAutoplay;
      document.getElementById('autoplayCheck').checked = isAutoplayEnabled;
      addLog(`[Sync] 알고리즘 연속재생: ${isAutoplayEnabled ? '켜짐' : '꺼짐'}`);
    });

    function addToQueue(item, playNow = false) {
      const vId = item.id || item.videoId;
      const title = item.title || '제목 없음';
      const author = item.author || item.channel || 'YouTube';
      const thumb = item.thumbnail || `https://img.youtube.com/vi/${vId}/hqdefault.jpg`;

      if (playNow) {
        playAndSyncVideo(vId, title);
        return;
      }

      const queueItem = { videoId: vId, title: title, channel: author, thumbnail: thumb };
      playQueue.push(queueItem);
      renderQueueList();

      socket.emit('sync-queue', { queue: playQueue });
      addLog(`[Queue] 대기열 추가: ${queueItem.title}`);
    }

    function removeFromQueue(index) {
      const removed = playQueue.splice(index, 1);
      renderQueueList();
      socket.emit('sync-queue', { queue: playQueue });
      if (removed.length > 0) addLog(`[Queue] 대기열 삭제: ${removed[0].title}`);
    }

    function playNextInQueue() {
      if (playQueue.length > 0) {
        const nextItem = playQueue.shift();
        renderQueueList();
        socket.emit('sync-queue', { queue: playQueue });
        playAndSyncVideo(nextItem.videoId, nextItem.title);
      }
    }

    function renderQueueList() {
      const queueList = document.getElementById('queueList');
      document.getElementById('queueCount').innerText = playQueue.length;
      queueList.innerHTML = '';

      if (playQueue.length === 0) {
        queueList.innerHTML = '<div style="font-size:11px; color:var(--text-muted); text-align:center; padding:30px 0;">대기열이 비어 있습니다.</div>';
        return;
      }

      playQueue.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        
        card.innerHTML = `
          <img class="card-thumb" src="${escapeHtml(item.thumbnail)}">
          <div class="card-info">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-channel">${escapeHtml(item.channel)}</div>
          </div>
          <button class="btn-remove-queue" title="삭제">✕</button>
        `;

        card.querySelector('.card-thumb').onclick = () => playAndSyncVideo(item.videoId, item.title);
        card.querySelector('.card-info').onclick = () => playAndSyncVideo(item.videoId, item.title);
        card.querySelector('.btn-remove-queue').onclick = () => removeFromQueue(index);

        queueList.appendChild(card);
      });
    }

    function switchTab(tab) {
      const queueList = document.getElementById('queueList');
      const resultsList = document.getElementById('resultsList');
      const tabQueueBtn = document.getElementById('tabQueueBtn');
      const tabSearchBtn = document.getElementById('tabSearchBtn');

      if (tab === 'queue') {
        queueList.style.display = 'flex';
        resultsList.style.display = 'none';
        tabQueueBtn.classList.add('active');
        tabSearchBtn.classList.remove('active');
      } else {
        queueList.style.display = 'none';
        resultsList.style.display = 'flex';
        tabSearchBtn.classList.add('active');
        tabQueueBtn.classList.remove('active');
      }
    }

    function executeSearch() {
      const input = document.getElementById('searchInput').value.trim();
      if (!input) return;

      switchTab('search');

      const videoId = extractVideoId(input);
      if (videoId) {
        playAndSyncVideo(videoId, `유튜브 영상 (${videoId})`);
      } else {
        performSearchQuery(input);
      }
    }

    async function performSearchQuery(query) {
      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = '<div style="font-size:12px; color:var(--text-muted); text-align:center; padding:20px;">동영상 목록 검색 중...</div>';

      try {
        const results = await ipcRenderer.invoke('search-youtube', query);
        const validVideos = (results || []).filter(item => item.id || item.videoId);

        if (validVideos.length > 0) {
          renderVideoCards(validVideos);
        } else {
          resultsList.innerHTML = '<div style="font-size:12px; color:var(--text-muted); text-align:center; padding:20px;">검색된 동영상이 없습니다.</div>';
        }
      } catch (err) {
        resultsList.innerHTML = '<div style="font-size:12px; color:var(--accent-red); text-align:center; padding:20px;">검색 실패</div>';
      }
    }

    function renderVideoCards(videos) {
      const resultsList = document.getElementById('resultsList');
      resultsList.innerHTML = '';

      videos.forEach(item => {
        const card = document.createElement('div');
        card.className = 'video-card';

        const videoId = item.id || item.videoId;
        const thumbnail = item.thumbnail || `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
        const channel = item.author || item.channel || 'YouTube Channel';

        card.innerHTML = `
          <img class="card-thumb" src="${escapeHtml(thumbnail)}">
          <div class="card-info">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-channel">${escapeHtml(channel)}</div>
          </div>
          <button class="btn-add-queue" title="대기열에 추가">+</button>
        `;

        card.querySelector('.card-thumb').onclick = () => playAndSyncVideo(videoId, item.title);
        card.querySelector('.card-info').onclick = () => playAndSyncVideo(videoId, item.title);

        card.querySelector('.btn-add-queue').onclick = (e) => {
          e.stopPropagation();
          addToQueue(item, false);
        };

        resultsList.appendChild(card);
      });
    }

    function playAndSyncVideo(videoId, title) {
      currentVideoId = videoId;
      loadYoutubeVideo(videoId);
      updateNowPlaying(title);

      socket.emit('sync-action', { action: 'load', videoId: videoId, title: title });
      addLog(`[Link] 재생 시작: ${title}`);
    }

    function toggleAutoplay(enabled) {
      isAutoplayEnabled = enabled;
      socket.emit('toggle-autoplay', { isAutoplay: enabled });
      addLog(`[Sync] 알고리즘 연속재생: ${enabled ? '켜짐' : '꺼짐'}`);
    }

    function updateNowPlaying(title) {
      document.getElementById('nowPlayingText').innerText = `🎵 ${title}`;
    }

    function addLog(msg) {
      const logBox = document.innerHTML ? document.getElementById('logBox') : null;
      if (logBox) {
        logBox.innerHTML += `<br>${msg}`;
        logBox.scrollTop = logBox.scrollHeight;
      }
    }
  </script>
</body>
</html>
